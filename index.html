<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1908 Soluções</title>
  <style>
    :root {
      --bg: #F7F7F8;
      --surface: #FFFFFF;
      --text: #18181B;
      --muted: #52525B;
      --border: #E4E4E7;
      --btn-bg: #18181B;
      --btn-hover: #27272A;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 16px 32px;
      flex: 1;
    }

    .header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 700;
    }

    .header p {
      margin: 0;
      font-size: 15px;
      color: var(--muted);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .app-info {
      flex: 1 1 320px;
    }

    .app-info h2 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 600;
    }

    .app-info p {
      margin: 0;
      font-size: 14.5px;
      color: var(--muted);
    }

    .btn {
      display: inline-block;
      background: var(--btn-bg);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 9px 16px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      padding: 20px 16px 28px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>1908 Soluções</h1>
    </header>

    <h2 class="section-title">Aplicativos</h2>

    <article class="app-card">
      <div class="app-info">
        <h2>Quiz da Bíblia</h2>
        <p>Aplicativo de perguntas e respostas bíblicas com funcionamento 100% offline.</p>
      </div>
      <a class="btn" href="privacidade/quiz-da-biblia.html">Política de Privacidade</a>
    </article>
  </main>

  <footer class="footer">
    © 2026 · Todos os direitos reservados. · 1908 Soluções
  </footer>
</body>
</html>
